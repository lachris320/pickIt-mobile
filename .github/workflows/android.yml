name: Android CI + APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so a tag build can publish a GitHub Release with the APK attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default `packages: tools platform-tools` now fails:
          # Google removed the legacy `tools` package from the SDK repository
          # ("Failed to find package 'tools'"). Request only platform-tools;
          # AGP auto-downloads the platform/build-tools the build needs.
          packages: platform-tools

      # No Gradle wrapper JAR is committed, so install Gradle 9.3.1 directly
      # (matches gradle/wrapper/gradle-wrapper.properties) and use `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The debug build type points at ${rootDir}/debug.keystore, which is not
      # committed; generate a throwaway one so assembleDebug can sign the APK.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run engine unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.PickleballEngineTest" --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/*.apk \
            --title "${{ github.ref_name }}" \
            --notes "Debug APK build of PickIt. Download the .apk on your phone and install it (you may need to allow installing from unknown sources)."
